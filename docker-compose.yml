services:
  mongo:
    image: mongo:8
    container_name: mon-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Week 5: redis
  # Week 9: postgres

volumes:
  mongo-data:
